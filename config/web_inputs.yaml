# Active flight export uses official Gold only. Paid-provider historical
# estimates remain private and are never publication prerequisites.
schema_version: 1
views:
  flights:
    required_for_publish:
      - data/gold/fact_route_traffic.parquet
      - data/gold/fact_route_traffic_summary.parquet
      - data/gold/dim_airport.parquet
    optional_for_development:
      - data/gold/fact_domestic_scheduled_route_movements.parquet
      - data/gold/fact_aicm_international_scheduled_route_movements.parquet
      - data/gold/fact_international_route_observations.parquet
      - data/gold/fact_oma_documented_routes.parquet
  executive:
    required_for_publish: []
    optional_for_development: []
  market:
    required_for_publish: []
    optional_for_development: []
