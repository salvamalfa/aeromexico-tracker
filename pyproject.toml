[project]
name = "aeromexico-tracker"
version = "0.1.0"
description = "Reproducible public-data pipeline and business analytics dashboard for Grupo Aeromexico."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "beautifulsoup4==4.15.0",
  "duckdb==1.5.5",
  "httpx==0.28.1",
  "lxml==6.1.2",
  "openpyxl==3.1.5",
  "pandas==2.3.3",
  "pandera[pandas,polars]==0.32.1",
  "pdfplumber==0.11.10",
  "playwright==1.62.0",
  "plotly==6.9.0",
  "polars==1.43.2",
  "pyarrow==25.0.1",
  "pypdf==6.16.1",
  "python-dotenv==1.2.3",
  "pyyaml==6.0.3",
  "streamlit==1.62.0",
  "streamlit-echarts==0.4.0",
  "tenacity==9.1.4",
  "xlrd==2.0.2",
  "yfinance==1.6.0",
]

[project.optional-dependencies]
analytics = [
  "es-core-news-sm @ https://github.com/explosion/spacy-models/releases/download/es_core_news_sm-3.8.0/es_core_news_sm-3.8.0-py3-none-any.whl",
  "scikit-learn==1.9.0",
  "spacy==3.8.15",
  "statsforecast==2.1.1",
  "statsmodels==0.14.6",
]

[dependency-groups]
dev = [
  "ipykernel>=7.3.0",
  "nbclient>=0.11.0",
  "nbformat>=5.11.1",
  "pytest==9.1.1",
  "ruff>=0.16.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
# The dense, semicolon-joined generators predate ruff and are edited by hand
# for now; only format-only commits touch them (see REPO_MAP.md).
[tool.ruff.lint.per-file-ignores]
"src/analysis_agent/stage18.py" = ["E501", "E701", "E702", "E703"]
"src/analysis_agent/reader_ui.py" = ["E501", "E701", "E702", "E703"]
"src/analysis_agent/lifecycle.py" = ["E501", "E701", "E702", "E703"]
"src/dashboard/international_routes.py" = ["E501", "E701", "E702", "E703"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "local_data: needs locally-restored data ignored by git (data/warehouse.duckdb, data/silver, data/bronze raw captures, private Gold cubes, analysis_runs/); skipped with a reason when absent unless --require-local-data is passed.",
  "slow: takes more than about 5 seconds to run.",
  "browser: drives a real browser through Playwright.",
]
