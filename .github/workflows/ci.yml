name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true

      # Several modules the non-local-data suite imports at collection time
      # (src/analytics/*, src/transform/stage6_facts.py) depend on the
      # "analytics" extra (statsmodels, scikit-learn, spaCy, statsforecast),
      # so this mirrors refresh.yml's install rather than a bare `uv sync`.
      - name: Install locked dependencies
        run: uv sync --all-extras --all-groups --locked

      # data/warehouse.duckdb, data/silver, data/bronze raw captures, private
      # Gold cubes and analysis_runs/ are gitignored and local-only (see
      # AGENTS.md); this runner never has them. Tests that need them are
      # marked `local_data` (tests/conftest.py) and skip with an explicit
      # reason here. `browser` (Playwright) tests are excluded too: full
      # local validation, with the data restored, stays a local/manual step
      # (see docs/arquitectura/auditoria-arquitectura-20260926.md §2.5/§5).
      - name: Run the public test subset
        run: uv run pytest -m "not local_data and not browser" -q

      # Only these modules are ruff-formatted so far (see REPO_MAP.md and
      # docs/arquitectura/auditoria-arquitectura-20260926.md §5 fase 1); the
      # rest of the tree is not yet covered.
      - name: Check ruff format on migrated modules
        run: >-
          uv run ruff format --check
          src/dashboard/international_routes.py
          src/analysis_agent/stage18.py
          src/analysis_agent/reader_ui.py
          src/analysis_agent/lifecycle.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install web/ dependencies
        working-directory: web
        run: npm ci
      - name: Type-check (tsc --noEmit)
        working-directory: web
        run: npm run check
      - name: Unit tests (vitest)
        working-directory: web
        run: npm run test
      - name: Build (vite build)
        working-directory: web
        run: npm run build

      # The browser smoke tests (test_web_flights_smoke.py,
      # test_web_page_smoke.py) serve web/dist/ with the synthetic, public
      # fixtures at tests/fixtures/web/ — no warehouse, no analysis_runs/ —
      # so they are the only web/ browser tests that can run here; the
      # Playwright parity tests need the real, locally-restored warehouse
      # (`local_data`, see tests/conftest.py) and stay a local/manual step.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --all-extras --all-groups --locked
      - name: Install Playwright's chromium
        run: uv run playwright install --with-deps chromium
      - name: Browser smoke tests against the built site
        run: uv run pytest -m browser -q tests/test_web_flights_smoke.py tests/test_web_page_smoke.py
