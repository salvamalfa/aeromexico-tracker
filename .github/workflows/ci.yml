# Required test/web names stay stable; components fail closed.
# Narrow PR profiles are independently recomputed by both required gates.
name: CI
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - edited
  push:
    branches:
    - master
    paths-ignore:
    - site/**
    - .github/pages-preview.json
  workflow_call:
    inputs:
      force_full:
        type: boolean
        default: true
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CHAT_BUSINESS_METRICS_APPROVAL_RECEIPT_SHA256: ${{ vars.CHAT_BUSINESS_METRICS_APPROVAL_RECEIPT_SHA256 }}
  CHAT_EVIDENCE_APPROVED_INDEX_SHA256: ${{ vars.CHAT_EVIDENCE_APPROVED_INDEX_SHA256 }}
permissions:
  contents: read
jobs:
  change-plan:
    runs-on: ubuntu-latest
    outputs:
      execution: ${{ steps.plan.outputs.execution }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - id: plan
      name: Select conservative PR profile with a full fallback
      env:
        PLAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        PLAN_HEAD: ${{ github.sha }}
        PLAN_EVENT: ${{ github.event_name }}
        PLAN_FORCE_FULL: ${{ inputs.force_full || false }}
      run: |
        selection_args=()
        if [[ "$PLAN_FORCE_FULL" == false ]]; then
          selection_args+=(--enable-selection)
        fi
        python3 scripts/ci_change_plan.py --base "$PLAN_BASE" --head "$PLAN_HEAD" --event "$PLAN_EVENT" "${selection_args[@]}" --output test-results/change-plan.json --github-output "$GITHUB_OUTPUT"
    - name: Retain ci-change-plan
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ci-change-plan-${{ github.run_attempt }}
        path: test-results/change-plan.json
        if-no-files-found: error
        retention-days: 7
  pages-preflight:
    needs: [change-plan]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: astral-sh/setup-uv@v10.3.3
      with:
        python-version: '3.13'
        enable-cache: true
    - name: Verify the exact locked Pages environment and publication
      run: |
        publication_args=()
        if [[ "$CI_EXECUTION" == docs_only || "$CI_EXECUTION" == web_only ]]; then
          publication_args+=(--verify-published-base)
        fi
        python3 scripts/check_ci_pages.py --execute --report test-results/pages-preflight.json \
          --cache-state unknown --base "$PUBLICATION_BASE_COMMIT" "${publication_args[@]}"
      env:
        UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/pages-preflight-venv
        CI_EXECUTION: ${{ needs.change-plan.outputs.execution }}
        PUBLICATION_BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
    - name: Retain pages-preflight
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pages-preflight-${{ github.run_attempt }}
        path: test-results/pages-preflight.json
        if-no-files-found: error
        retention-days: 7
  docker-preflight:
    needs: [change-plan]
    if: ${{ needs.change-plan.outputs.execution == 'full' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Measure cold-stage build and offline runtime, then warm rebuild
      run: |-
        python3 scripts/check_ci_docker.py --execute --report test-results/docker-preflight-cold.json --cache-state cold --no-cache
        python3 scripts/check_ci_docker.py --execute --report test-results/docker-preflight-warm.json --cache-state warm
    - name: Retain docker-preflight
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: docker-preflight-${{ github.run_attempt }}
        path: test-results/docker-preflight-*.json
        if-no-files-found: error
        retention-days: 7
  static:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: astral-sh/setup-uv@v10.3.3
      with:
        python-version: '3.13'
        enable-cache: true
    - name: Install locked dependencies
      run: uv sync --all-extras --all-groups --locked
    - name: Check task file lifecycle dispositions and documentation references
      if: github.event_name == 'pull_request'
      env:
        DOC_LIFECYCLE_BASE: ${{ github.event.pull_request.base.sha }}
        DOC_LIFECYCLE_HEAD: ${{ github.event.pull_request.head.sha }}
        DOC_LIFECYCLE_SUMMARY: ${{ github.event.pull_request.body }}
      run: |
        git fetch --no-tags origin "$DOC_LIFECYCLE_BASE" "$DOC_LIFECYCLE_HEAD"
        uv run python scripts/check_document_lifecycle.py --base "$DOC_LIFECYCLE_BASE" --head "$DOC_LIFECYCLE_HEAD"
    - name: Ruff pyflakes check on src/ and scripts/
      run: uv run ruff check --select F src scripts
    - name: Check CI selection, gates, publication reuse and module budgets
      run: uv run --no-sync pytest -q tests/test_ci_change_plan.py tests/test_ci_job_gates.py tests/test_pages_ci_evidence.py tests/test_ci_pages_preflight.py tests/test_ci_pages_historical.py tests/test_ci_public_test_files.py tests/test_repo_budgets.py --junitxml=test-results/controls.xml
    - name: Retain CI control timings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ci-control-results-${{ github.run_attempt }}
        path: test-results/controls.xml
        if-no-files-found: error
        retention-days: 7
    - name: Check ruff format on migrated modules
      run: uv run ruff format --check src/dashboard/international_routes.py src/analysis_agent/lifecycle.py
  chat-runtime:
    needs: [change-plan]
    if: ${{ needs.change-plan.outputs.execution == 'full' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: astral-sh/setup-uv@v10.3.3
      with:
        python-version: '3.13'
        enable-cache: true
    - name: Install isolated chat runtime profile
      run: uv sync --locked --only-group chat-runtime
      env:
        UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/chat-runtime-venv
    - name: Smoke test isolated chat runtime
      run: uv run --locked --only-group chat-runtime python -m scripts.check_chat_runtime
      env:
        UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/chat-runtime-venv
  public-tests:
    if: ${{ needs.change-plan.outputs.execution == 'full' }}
    strategy:
      fail-fast: false
      matrix:
        partition: [core-a, core-b, publication]
    needs:
    - change-plan
    - static
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: astral-sh/setup-uv@v10.3.3
      with:
        python-version: '3.13'
        enable-cache: true
    - name: Install locked dependencies
      run: uv sync --all-extras --all-groups --locked
    - name: Install and check the pinned CI test tools
      run: |
        uv --no-config pip install --python .venv/bin/python \
          --only-binary :all: --no-deps --require-hashes -r .github/ci-test-tools.txt
        uv pip check --python .venv/bin/python
    - name: Run the public test subset
      env:
        PYTHONUNBUFFERED: '1'
        PYTEST_PARTITION: ${{ matrix.partition }}
        PUBLICATION_BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      run: |
        # A code-only PR verifies the existing publication with its released
        # verifier. This does not approve the PR runtime for publication.
        # Actual publication changes still use the ordinary financial gate.
        pytest_args=(-m "not local_data and not browser" -vv --tb=short --capture=tee-sys -o faulthandler_timeout=300 --durations=30)
        if [[ "$PUBLICATION_BASE_COMMIT" =~ ^[a-f0-9]{40}$ ]] \
          && git merge-base --is-ancestor "$PUBLICATION_BASE_COMMIT" HEAD \
          && git diff --quiet "$PUBLICATION_BASE_COMMIT" HEAD -- site; then
          pytest_args+=(--financial-publication-base "$PUBLICATION_BASE_COMMIT")
        fi
        mkdir -p test-results
        python3 scripts/ci_public_test_files.py --partition "$PYTEST_PARTITION" > test-results/public-files.zlist
        mapfile -d '' -t pytest_files < test-results/public-files.zlist
        uv run --no-sync pytest -n 2 --dist=loadfile --max-worker-restart=0 \
          "${pytest_args[@]}" "${pytest_files[@]}" --junitxml="test-results/public-${PYTEST_PARTITION}.xml"
    - name: Retain public test timings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: public-test-results-${{ matrix.partition }}-${{ github.run_attempt }}
        path: test-results/public-*.xml
        if-no-files-found: ignore
        retention-days: 7
  web-checks:
    if: ${{ needs.change-plan.outputs.execution != 'docs_only' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: web/package-lock.json
    - name: Install web/ dependencies
      working-directory: web
      run: npm ci
    - name: Type-check (tsc --noEmit)
      working-directory: web
      run: npm run check
    - name: Unit tests (vitest)
      working-directory: web
      run: npm run test
    - name: Build (vite build)
      working-directory: web
      run: npm run build
    - uses: astral-sh/setup-uv@v10.3.3
      with:
        python-version: '3.13'
        enable-cache: true
    - name: Install locked dependencies
      run: uv sync --all-extras --all-groups --locked
    - name: Install and probe pinned headless Chromium
      timeout-minutes: 12
      run: |
        uv run --no-sync playwright install --only-shell chromium
        probe_browser() {
          timeout --kill-after=5s 60s uv run --no-sync python - <<'PYTHON'
        from pathlib import Path
        from playwright.sync_api import sync_playwright
        legacy = Path("/opt/pw-browsers/chromium-1194/chrome-linux/chrome")
        executables = [None] + ([str(legacy)] if legacy.exists() else [])
        with sync_playwright() as playwright:
            for executable in executables:
                browser = playwright.chromium.launch(headless=True, executable_path=executable)
                page = browser.new_page()
                page.set_content("<p>Información de Aeroméxico</p>")
                assert page.locator("p").inner_text() == "Información de Aeroméxico"
                browser.close()
        PYTHON
        }
        if ! probe_browser; then
          uv run --no-sync playwright install-deps chromium
          probe_browser
        fi
    - name: Browser smoke tests against the built site
      run: uv run pytest -m browser -q --durations=30 --junitxml=test-results/browser.xml tests/test_web_flights_smoke.py
        tests/test_web_page_smoke.py tests/test_web_chat_smoke.py tests/test_web_review_smoke.py tests/test_web_financial_smoke.py
    - name: Retain browser test timings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: browser-test-results-${{ github.run_attempt }}
        path: test-results/browser.xml
        if-no-files-found: ignore
        retention-days: 7
    needs:
    - change-plan
    - static
  test:
    if: ${{ always() }}
    needs:
    - change-plan
    - pages-preflight
    - docker-preflight
    - static
    - chat-runtime
    - public-tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Require success from every component
      env:
        CI_REQUIRED_RESULTS: ${{ toJSON(needs) }}
        CI_PLAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        CI_PLAN_HEAD: ${{ github.sha }}
        CI_PLAN_EVENT: ${{ github.event_name }}
        CI_PLAN_FORCE_FULL: ${{ inputs.force_full || false }}
      run: python3 scripts/check_ci_jobs.py test
  web:
    if: ${{ always() }}
    needs:
    - change-plan
    - pages-preflight
    - docker-preflight
    - static
    - chat-runtime
    - web-checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Require success from every component
      env:
        CI_REQUIRED_RESULTS: ${{ toJSON(needs) }}
        CI_PLAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        CI_PLAN_HEAD: ${{ github.sha }}
        CI_PLAN_EVENT: ${{ github.event_name }}
        CI_PLAN_FORCE_FULL: ${{ inputs.force_full || false }}
      run: python3 scripts/check_ci_jobs.py web
