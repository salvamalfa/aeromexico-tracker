name: Prepare weekly chat news candidates (manual review only)

on:
  workflow_dispatch:
    inputs:
      week_start:
        description: Monday UTC date for the candidate batch (YYYY-MM-DD)
        required: true
        type: string
      metadata_file:
        description: Committed headline metadata JSON under config/chat/evidence/candidates/news/inbox/
        required: true
        type: string
      write_candidate:
        description: Build a closed candidate manifest and attach it as a workflow artifact
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Validate metadata path
        env:
          METADATA_FILE: ${{ inputs.metadata_file }}
        run: |
          python - "$METADATA_FILE" <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          root = Path.cwd().resolve()
          inbox = (root / "config/chat/evidence/candidates/news/inbox").resolve()
          raw_path = Path(sys.argv[1])
          requested = root / raw_path
          candidate = requested.resolve()
          in_repo_path = [requested, *requested.parents]
          has_symlink = any(path.is_symlink() for path in in_repo_path if path == root or root in path.parents)
          if (
              raw_path.is_absolute() or ".." in raw_path.parts or has_symlink
              or not candidate.is_relative_to(inbox) or candidate.suffix != ".json" or not candidate.is_file()
          ):
              raise SystemExit("metadata_file must resolve to a JSON file inside the news inbox")
          relative = candidate.relative_to(root).as_posix()
          if subprocess.run(
              ["git", "ls-files", "--error-unmatch", "--", relative], check=False,
              stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
          ).returncode:
              raise SystemExit("metadata_file must be tracked in Git and cannot be a symlink")
          PY
      - name: Build weekly candidate manifest
        env:
          WEEK_START: ${{ inputs.week_start }}
          METADATA_FILE: ${{ inputs.metadata_file }}
          WRITE_CANDIDATE: ${{ inputs.write_candidate }}
        run: |
          args=(--week-start "$WEEK_START" --input "$METADATA_FILE" --output-dir "$RUNNER_TEMP/news-candidates")
          if [ "$WRITE_CANDIDATE" = "true" ]; then
            args+=(--write-candidate)
          fi
          uv run python scripts/chat/collect_news_candidates.py "${args[@]}"
      - name: Attach closed candidate manifest for owner review
        if: ${{ inputs.write_candidate }}
        uses: actions/upload-artifact@v4
        with:
          name: chat-news-candidates-${{ inputs.week_start }}
          path: ${{ runner.temp }}/news-candidates/news-${{ inputs.week_start }}.json
          if-no-files-found: error
          retention-days: 14
