name: Monitor freshness and validate Gold

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 5 2,5,8,11 *"

concurrency:
  group: dashboard-refresh
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      force_full: true

  validate:
    needs: [ci]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        id: checkout
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install locked dependencies
        id: dependencies
        run: uv sync --all-extras --all-groups --locked

      - name: Check the exact CI snapshot before Stage 8
        id: snapshot_before
        continue-on-error: true
        shell: bash
        env:
          REFRESH_SHA: ${{ github.sha }}
        run: |
          current_sha="$(git rev-parse HEAD)"
          test "$current_sha" = "$REFRESH_SHA"
          git -c core.fileMode=true diff --no-ext-diff --exit-code "$REFRESH_SHA" -- data/gold docs/diccionario-datos.md
          # Include ignored files too: CI only validated the versioned snapshot.
          unexpected_files="$(git ls-files --others -- data/gold docs/diccionario-datos.md)"
          test -z "$unexpected_files"

      - name: Detect stale manual-source data
        id: manual_source
        run: uv run python -m src.dashboard.check_manual_freshness --source afac --max-age-days 62

      - name: Open AFAC manual-refresh reminder
        if: steps.manual_source.outputs.is_stale == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `AFAC requiere actualización manual (datos hasta ${{ steps.manual_source.outputs.last_date }})`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });
            if (!existing.data.some(issue => issue.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `La fuente manual-source AFAC tiene ${{ steps.manual_source.outputs.age_days }} días de antigüedad. Requiere descarga asistida y reconstrucción local; la ausencia no se interpreta como cero.`
              });
            }

      # Stage 8's data-only checks (`src.dashboard.validate_stage8`) are not run by
      # anything else, so this workflow runs them explicitly, fail-closed,
      # against the Gold this run is about to commit: it needs only the
      # public, versioned `data/gold/*.parquet` (via
      # `src.dashboard.data.query_df`'s in-memory DuckDB views over those
      # files), never the gitignored `data/warehouse.duckdb`.
      - name: Validate Stage 8 dashboard data
        id: validate_stage8
        if: steps.snapshot_before.outcome == 'success'
        continue-on-error: true
        run: uv run python -m src.dashboard.validate_stage8

      - name: Recheck the validated snapshot before commit
        id: snapshot_after
        if: ${{ always() && !cancelled() && steps.snapshot_before.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          REFRESH_SHA: ${{ github.sha }}
        run: |
          current_sha="$(git rev-parse HEAD)"
          test "$current_sha" = "$REFRESH_SHA"
          git -c core.fileMode=true diff --no-ext-diff --exit-code "$REFRESH_SHA" -- data/gold docs/diccionario-datos.md
          # Include ignored files too: CI only validated the versioned snapshot.
          unexpected_files="$(git ls-files --others -- data/gold docs/diccionario-datos.md)"
          test -z "$unexpected_files"

      - name: Open validation-failed issue
        id: failure_issue
        if: ${{ always() && !cancelled() && (needs.ci.result != 'success' || steps.snapshot_before.outcome != 'success' || steps.manual_source.outcome != 'success' || steps.validate_stage8.outcome != 'success' || steps.snapshot_after.outcome != 'success') }}
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Dashboard validation-failed · ${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `La validación falló y no se hizo commit de cambios en gold. Revisa la ejecución: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Stop before commit when validation failed
        id: stop_on_failure
        if: ${{ always() && !cancelled() && (needs.ci.result != 'success' || steps.snapshot_before.outcome != 'success' || steps.manual_source.outcome != 'success' || steps.validate_stage8.outcome != 'success' || steps.snapshot_after.outcome != 'success') }}
        run: exit 1

      - name: Commit validated gold updates
        id: commit
        if: ${{ success() && needs.ci.result == 'success' && steps.snapshot_before.outcome == 'success' && steps.manual_source.outcome == 'success' && steps.validate_stage8.outcome == 'success' && steps.snapshot_after.outcome == 'success' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gold docs/diccionario-datos.md
          if git diff --cached --quiet; then
            echo "No validated gold changes to commit."
          else
            git commit -m "Refresh validated dashboard gold data"
            git push
          fi
