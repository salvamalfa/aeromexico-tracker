name: Pages

# Deploys site/ as it already is in master — never rebuilds it, never
# touches analysis_runs/ or any secret. See src/publish/README.md.
# src.publish.verify needs no private data: it checks
# publication_manifest.json's own schema, every listed file's hash/size,
# that no unlisted file is present, and every data/v1/**/*.json file
# against contracts/web/*.schema.json + privacy.yaml. deploy also depends
# on ci.yml (called here via workflow_call) so a push to master never
# ships a site/ built from code whose own tests/web checks are failing.

on:
  push:
    branches: [master]
    paths: ["site/**", ".github/pages-preview.json"]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
      # Only jsonschema/PyYAML (src.publish.verify's own imports) are
      # needed here, but the project has one locked environment; this
      # never installs the "analytics" extra's heavier deps for nothing
      # since uv resolves from the same lockfile CI already trusts.
      - name: Install locked dependencies
        run: uv sync --locked --no-group dev
      - name: Verify site/ (no private data, no rebuild)
        run: uv run python -m src.publish.verify site/

  # Deploying site/ should never ship ahead of the same checks a PR into
  # master already had to pass: this reuses ci.yml itself (as a
  # workflow_call) rather than duplicating its two jobs, so there is one
  # place that defines "the public test subset and web/ checks pass".
  ci:
    uses: ./.github/workflows/ci.yml

  preview:
    runs-on: ubuntu-latest
    outputs:
      path: ${{ steps.read.outputs.path }}
      ref: ${{ steps.read.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        name: Read .github/pages-preview.json
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib, re
          config = pathlib.Path(".github/pages-preview.json")
          if config.is_file():
              data = json.loads(config.read_text(encoding="utf-8"))
              path, ref = data["path"], data["ref"]
              if not re.fullmatch(r"[a-z0-9][a-z0-9-]*", path) or path in {"assets", "data"}:
                  raise SystemExit(f"invalid preview path: {path!r}")
              if not re.fullmatch(r"[0-9a-f]{40}", ref):
                  raise SystemExit(f"preview ref must be a full commit SHA: {ref!r}")
              if pathlib.Path("site", path).exists():
                  raise SystemExit(f"site/{path} already exists in master")
              print(f"path={path}")
              print(f"ref={ref}")
          PY
      - if: steps.read.outputs.ref != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.read.outputs.ref }}
          path: _preview
      - if: steps.read.outputs.ref != ''
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
      # The preview's site/ is signed against its own commit's contracts,
      # so it is verified with that commit's own code, not master's.
      - if: steps.read.outputs.ref != ''
        name: Verify the preview's site/ with its own verifier
        working-directory: _preview
        run: |
          uv sync --locked --no-group dev
          uv run python -m src.publish.verify site/

  deploy:
    needs: [verify, preview, ci]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - if: needs.preview.outputs.ref != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preview.outputs.ref }}
          path: _preview
      - name: Assemble master's site/ plus the pinned preview
        env:
          PREVIEW_PATH: ${{ needs.preview.outputs.path }}
          PREVIEW_REF: ${{ needs.preview.outputs.ref }}
        run: |
          mkdir _pages
          cp -a site/. _pages/
          if [ -n "$PREVIEW_REF" ]; then
            cp -a _preview/site "_pages/$PREVIEW_PATH"
            echo "Preview $PREVIEW_REF served under /$PREVIEW_PATH/"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
      - id: deployment
        uses: actions/deploy-pages@v4
