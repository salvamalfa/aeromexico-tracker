carrier_key: VOLARIS
cik: "0001520504"
reporting_currency: USD
unit_system: imperial
fiscal_year_end_month: 12
forms: [6-K, 20-F]
metric_patterns:
  asm_total:
    # 2Q23 splits the label across cells ("seat miles (ASMs) (millions)").
    patterns: ['available seat miles \(asms\) \(millions.*?\)', '^seat miles \(asms\) \(millions.*?\)']
    unit_raw: "ASMs (millions)"
    unit_normalized: miles
    scale_multiplier: 1000000
    table_name: operating
  rpm_total:
    patterns: ['revenue passenger miles \(rpms\) \(millions.*?\)', '^passenger miles \(rpms\) \(millions.*?\)']
    unit_raw: "RPMs (millions)"
    unit_normalized: miles
    scale_multiplier: 1000000
    table_name: operating
  passengers:
    # Quarterly row first ("scheduled & charter"); older releases only carry
    # the "Booked passengers" row, whose first value is also the quarter.
    patterns: ['^passengers \(thousands?, scheduled & charter\)', '^(?:booked )?passengers \(thousands\)']
    unit_raw: "passengers (thousands)"
    unit_normalized: count
    scale_multiplier: 1000
    table_name: operating
  load_factor_total:
    patterns: ['load factor(?: \(\d+\))?', '^factor \(scheduled, rpms/asms\)']
    unit_raw: "%"
    unit_normalized: fraction
    scale_multiplier: 0.01
    table_name: operating
  casm:
    patterns: ['operating expenses per asm \(casm\) \(cents\)(?: \(\d+\))?', '^expenses per asm \(casm\) \(cents\)', '^casm \(cents\)']
    unit_raw: "USD cents"
    unit_normalized: usd_cents
    scale_multiplier: 1
    table_name: operating
  casm_ex_fuel:
    # Anchored to table rows: the unanchored 'casm ex fuel' used to match the
    # headline bullet ("CASM ex fuel increased 7.9% to ...") and read the % change.
    patterns: ['^casm ex[- ]fuel \(cents\)', '^casm excl\. fuel \(cents\)', '^casm ex[- ]fuel(?= [\d(])']
    unit_raw: "USD cents"
    unit_normalized: usd_cents
    scale_multiplier: 1
    table_name: operating
  trasm:
    patterns: ['total operating revenue per asm \(trasm\) \(cents\)(?: \(\d+\))?', '^operating revenue per asm \(trasm\) \(cents\)', 'trasm \(cents\)']
    unit_raw: "USD cents"
    unit_normalized: usd_cents
    scale_multiplier: 1
    table_name: operating
  total_revenue:
    patterns: ['total operating revenues \(millions\)']
    unit_raw: "USD millions"
    unit_normalized: usd
    scale_multiplier: 1000000
    table_name: financial
